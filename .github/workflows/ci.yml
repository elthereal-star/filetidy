name: ci

on:
  push:
    branches: [ main ]
  # 不加 branches 过滤：堆叠 PR（base 是另一个特性分支而不是 main）同样需要校验，
  # 否则在 #1 合并之前，后面这串 PR 会处在无人验证的状态。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个平台都跑完，避免一个失败掩盖另一个平台的问题
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Smoke test the shaded jar
        shell: bash
        run: |
          java -jar target/filetidy.jar --version
          java -jar target/filetidy.jar organize --help

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore
